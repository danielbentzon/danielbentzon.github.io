media:
  input: assets/images
  output: /assets/images

content:
  - name: forside
    label: Forside (navn og undertitel)
    type: file
    path: _data/forside.yml
    fields:
      - name: navn
        label: Navn
        type: string
      - name: undertitel
        label: Undertitel
        type: string

  - name: sektioner
    label: Sektioner på forsiden (Om, Ydelser, Tilgang, Kontakt)
    type: collection
    path: _sektioner
    filename: "{primary}.md"
    fields:
      - name: title
        label: Overskrift (bruges også i menuen)
        type: string
      - name: raekkefolge
        label: Rækkefølge i menuen (1 kommer først)
        type: number
      - name: moerk
        label: Sort baggrund
        type: boolean
      - name: body
        label: Tekst
        type: rich-text

  - name: skriverier
    label: Skriverier (blog + essays samlet)
    type: collection
    path: _skriverier
    filename: "{primary}.md"
    fields:
      - name: title
        label: Titel
        type: string
      - name: date
        label: Dato (kan altid ændres)
        type: date
      - name: genre
        label: Genre (vises kun i oversigten, ikke på selve siden)
        type: select
        options:
          values:
            - Blog
            - Essay
      - name: body
        label: Tekst
        type: rich-text

  - name: sider
    label: Sider (uden fast plads i menuen endnu)
    type: collection
    path: _sider
    filename: "{primary}.md"
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: Tekst
        type: rich-text